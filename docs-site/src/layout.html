<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
document.documentElement.classList.add('js');
try { var t = localStorage.getItem('marionette-theme');
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/site.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='2' fill='%23181818'/><text x='2' y='12' font-family='monospace' font-size='11' fill='%23b5bd68'>$</text></svg>">
</head>
<body>
<a class="skip-link" href="#main">skip to content</a>
<header class="site-header">
  <div class="header-inner">
    <a class="site-title" href="/">
      <span class="site-mark" aria-hidden="true">$</span>
      <span>marionette<small>compiler + runtime documentation</small></span>
    </a>
    <span class="spacer"></span>
    <button type="button" class="theme-toggle" aria-pressed="false" hidden>light mode</button>
    <a class="header-link" href="https://github.com/leemeichin/marionette">GitHub <span aria-hidden="true">↗</span></a>
  </div>
</header>
<div class="shell">
<nav class="site-nav" aria-label="Site">
  <p class="nav-label">Documentation</p>
  <ul>
{{nav}}
  </ul>
</nav>
<main id="main">
{{content}}
</main>
</div>
<footer class="site-footer">
  <div>
    <p><strong>marionette</strong><br>Compiler, validator and runtime for plain-text project trajectories.</p>
    <p><a href="/getting-started">Get started</a> · <a href="/docs">Reference</a> ·
      <a href="https://github.com/leemeichin/marionette">Source on GitHub</a></p>
  </div>
</footer>
<script src="/theme.js"></script>
<script src="/demo.js"></script>
<script type="module" src="/code.js"></script>
</body>
</html>
