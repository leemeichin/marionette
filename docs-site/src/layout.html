<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
document.documentElement.classList.add('js');
try { var t = localStorage.getItem('marionette-theme');
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/site.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%231b202a'/><text x='2' y='12' font-family='monospace' font-size='11' fill='%2393d9b2'>$</text></svg>">
</head>
<body>
<a class="skip-link" href="#main">skip to content</a>
<header class="site-header">
  <a class="site-title" href="/"><span class="site-prompt">$ </span>marionette</a>
  <span class="spacer"></span>
  <button type="button" class="theme-toggle" aria-pressed="false" hidden>light mode</button>
  <a href="https://github.com/leemeichin/marionette">github</a>
</header>
<div class="shell">
<nav class="site-nav" aria-label="Site">
  <ul>
{{nav}}
  </ul>
</nav>
<main id="main">
{{content}}
</main>
</div>
<footer class="site-footer">
  <p>marionette — the plan is the agent's script; the compiler guarantees the script is sound; humans author and gate it.
  · <a href="https://github.com/leemeichin/marionette">source</a></p>
</footer>
<script src="/theme.js"></script>
<script src="/demo.js"></script>
</body>
</html>
