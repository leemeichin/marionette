<h1 class="visually-hidden">Playground</h1>

<noscript><p><strong>The playground needs JavaScript</strong> — it runs the
compiler in your browser. The <a href="/walkthrough">walkthrough</a> shows
the same flow as captured terminal sessions.</p></noscript>

<section class="pg-tutorial" data-tutorial hidden>
  <div class="pg-tut-bar">
    <span class="pg-tut-where" data-tut-where></span>
    <span class="pg-tut-nav">
      <button type="button" data-tut-prev>← prev</button>
      <button type="button" data-tut-next disabled>next →</button>
      <button type="button" data-tut-toggle>free play</button>
    </span>
  </div>
  <h2 class="pg-tut-title" data-tut-title></h2>
  <p class="pg-tut-text" data-tut-text></p>
  <p class="pg-tut-goal"><strong>Goal:</strong> <span data-tut-goal></span>
    <span class="pg-tut-status" data-tut-status role="status"></span></p>
</section>

<div class="pg" data-playground>
  <section class="pg-editor" aria-label="Plan editor">
    <div class="pg-toolbar">
      <label class="pg-example-row" data-examples-row>
        <span>load example</span>
        <select data-examples></select>
      </label>
      <button type="button" class="pg-tut-enter" data-tut-enter hidden>tutorial</button>
    </div>
    <textarea id="pg-src" spellcheck="false" autocomplete="off" aria-label="playground.mar — edits compile as you type"></textarea>
    <div class="pg-diagnostics" data-diagnostics aria-label="compiler diagnostics" role="log"></div>
  </section>

  <section class="pg-viz" aria-label="Graph and walk">
    <div class="pg-canvas" data-canvas aria-hidden="true"></div>
    <div class="pg-walk" data-walk>
      <div class="pg-walk-controls">
        <fieldset class="pg-actor">
          <legend>acting as</legend>
          <label><input type="radio" name="pg-actor" value="agent" checked> agent</label>
          <label><input type="radio" name="pg-actor" value="human"> human</label>
        </fieldset>
        <label class="pg-rationale-row">rationale
          <input id="pg-rationale" type="text" value="exploring in the playground">
        </label>
        <button type="button" class="pg-reset" data-reset>↺ reset</button>
      </div>
      <div class="pg-node" data-node role="status"></div>
      <div class="pg-choices" data-choices></div>
      <ol class="pg-log" data-log aria-label="decision log"></ol>
    </div>
  </section>
</div>

<script type="importmap">
{"imports":{"three":"/vendor/three.module.min.js"}}
</script>
<script type="module" src="/playground.js"></script>
